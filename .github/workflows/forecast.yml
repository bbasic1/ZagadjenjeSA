name: Večernja prognoza

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Samo ispiši poruku, ne šalji u kanal"
        type: boolean
        default: true
  # Skripta šalje samo poslije 18:00 lokalno i samo jednom dnevno, pa
  # višak termina ne smeta. GitHub često preskoči ili kasni sa scheduled
  # runovima, zato rezervni termini do ~21:20 lokalno.
  schedule:
    - cron: "20 16 * * *"
    - cron: "20 17 * * *"
    - cron: "50 17 * * *"
    - cron: "20 18 * * *"
    - cron: "20 19 * * *"

permissions:
  contents: write

# runovi idu jedan po jedan, pa sljedeći vidi već snimljenu prognozu i ne šalje duplo
concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - run: pip install -r requirements.txt
      - run: python -m bot.forecast ${{ inputs.dry && '--dry' || '' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Sačuvaj prognozu u repo
        # i kad je slanje završilo kodom 1 (rezervna prognoza): poruka je otišla,
        # pa snimak mora ući u repo, inače sljedeći termin šalje drugu poruku
        if: ${{ !cancelled() }}
        run: |
          git config user.name "air-bot"
          git config user.email "air-bot@users.noreply.github.com"
          [ -d data/predictions ] || exit 0   # nije bilo slanja (proba ili preskočen termin)
          git add data/predictions/
          if [ -d data/predictions_dan_vece ]; then git add data/predictions_dan_vece/; fi
          git commit -m "prognoza $(date -u +'%Y-%m-%d')" || exit 0
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort || true
            sleep 15
          done
          exit 1
