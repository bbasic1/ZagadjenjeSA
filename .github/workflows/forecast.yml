name: Večernja prognoza

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Samo ispiši poruku, ne šalji u kanal"
        type: boolean
        default: true
  # Skripta šalje samo poslije 18:00 lokalno i samo jednom dnevno, pa
  # višak termina ne smeta. GitHub često preskoči ili kasni sa scheduled
  # runovima, zato rezervni termini do ~21:20 lokalno.
  schedule:
    - cron: "20 16 * * *"
    - cron: "20 17 * * *"
    - cron: "50 17 * * *"
    - cron: "20 18 * * *"
    - cron: "20 19 * * *"

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - run: pip install -r requirements.txt
      - run: python forecast.py ${{ inputs.dry && '--dry' || '' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Sačuvaj prognozu u repo
        run: |
          git config user.name "air-bot"
          git config user.email "air-bot@users.noreply.github.com"
          [ -d data/predictions ] || exit 0   # nije bilo slanja (proba ili preskočen termin)
          git add data/predictions/
          git commit -m "prognoza $(date -u +'%Y-%m-%d')" || exit 0
          git pull --rebase
          git push
