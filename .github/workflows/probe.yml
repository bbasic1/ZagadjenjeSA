name: Proba Open-Meteo

on:
  push:
    paths:
      - .github/workflows/probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Brzina Previous Runs API
        run: |
          for v in temperature_2m temperature_850hPa boundary_layer_height; do
            for range in "2025-01-01 2025-01-07" "2025-01-01 2025-06-30"; do
              set -- $range
              /usr/bin/time -f "$v $1..$2: %e s" curl -s -o out.json -w "HTTP %{http_code} " --max-time 300 \
                "https://previous-runs-api.open-meteo.com/v1/forecast?latitude=43.848&longitude=18.362&hourly=${v}_previous_day2,${v}_previous_day3&start_date=$1&end_date=$2&timezone=GMT" || true
              head -c 300 out.json; echo
            done
          done
