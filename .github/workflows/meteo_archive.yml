name: Meteo arhiva prognoza

on:
  # samo ručno: novo povlačenje troši Open-Meteo limit koji treba satnom prikupljanju
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - run: pip install -r requirements.txt
      - run: python -u -m ingest.fetch_meteo_archive
      - name: Sačuvaj arhivu u repo
        run: |
          git config user.name "air-bot"
          git config user.email "air-bot@users.noreply.github.com"
          git add data/meteo/
          git commit -m "Meteo arhiva $(date -u +'%Y-%m-%d %H:%M')" || exit 0
          git pull --rebase
          git push
