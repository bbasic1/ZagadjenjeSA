name: Testovi

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "5 6 * * *"   # jednom dnevno uživo provjera da FHMZ stranice nisu promijenile format

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests -v
        env:
          LIVE: "1"
