name: Testovi

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "5 6 * * *"   # jednom dnevno uživo provjera da FHMZ stranice nisu promijenile format

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests -v
        env:
          LIVE: "1"
